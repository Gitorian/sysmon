[package]
name = "sysmon"
version = "0.3.1"
edition = "2021"
description = "Lightweight GPU/CPU/RAM monitoring with minimal latency impact"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Gitorian/sysmon"
readme = "README.md"

[dependencies]
nvml-wrapper = { version = "0.12", default-features = false, optional = true }
adlx = { version = "0.0.0-alpha.1", optional = true }

crossterm = { version = "0.29", default-features = false, features = ["windows", "events"] }
ctrlc = { version = "3.5", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
anyhow = "1.0"

windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_Media"
] }

[features]
default = ["nvidia", "amd"]
nvidia = ["nvml-wrapper"]
amd = ["adlx"]

[profile.release]
opt-level = 2
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
overflow-checks = false
debug = false
incremental = false

[profile.release.package."*"]
opt-level = 2
strip = true

[package]
name = "sysmon"
version = "0.2.0"
edition = "2021"

[dependencies]
windows = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_SystemInformation"] }
nvml-wrapper = { version = "0.10", optional = true }
adlx = { version = "0.1", optional = true }
crossterm = { version = "0.28", default-features = false }
ctrlc = "3.4"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
anyhow = "1.0"

[features]
default = ["nvidia", "amd"]
nvidia = ["dep:nvml-wrapper"]
amd = ["dep:adlx"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[[bin]]
name = "sysmon"
path = "src/main.rs"
